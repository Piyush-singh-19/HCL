services:
  - type: web
    name: portfoliopro-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8085

  - type: web
    name: portfoliopro-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist/portfolio-pro/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
