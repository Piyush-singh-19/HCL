server:
  port: ${PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: PortfolioPro
  datasource:
    # Uses in-memory/file H2 by default for zero-friction local execution, easily toggled to MySQL
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/portfoliopro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  trading:
    default-virtual-balance: 1000000.00
    currency: "INR"
    currency-symbol: "₹"
